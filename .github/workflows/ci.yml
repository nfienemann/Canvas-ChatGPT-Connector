name: Synthetic checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      desktop_preview:
        description: Build and publish a verified unsigned local-demo preview
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: bridge_fixture
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bridge -d bridge_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://bridge:synthetic-ci-only@127.0.0.1:5432/bridge_fixture
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: "0.13.4"
      - run: sudo apt-get update && sudo apt-get install -y libtesseract-dev tesseract-ocr-eng
      - run: uv sync --locked
      - run: uv pip check
      - name: Gate deterministic academic accuracy and privacy regressions
        run: uv run --locked python -m canvas_bridge.benchmark_lab run --tier fast --output .local/academic-benchmark
      - name: Gate scientific source retrieval without claiming interpretation accuracy
        run: uv run --locked python -m canvas_bridge.scientific_benchmark --output .local/academic-benchmark/scientific-v3.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: academic-benchmark-fast
          path: .local/academic-benchmark
          if-no-files-found: error
          retention-days: 30
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: ui/page-reader
      - run: npm run build && git diff --exit-code -- ../../src/canvas_bridge/assets
        working-directory: ui/page-reader
      - name: Validate governance registry, documentation and approved fictional fixtures
        run: uv run --locked canvas-bridge compliance-report --validate-only
      - run: uv run --locked python -m canvas_bridge.compliance.checks node_vulnerabilities --output .local/compliance-input/checks/node_vulnerabilities.json
      - run: uv run --locked python -m canvas_bridge.compliance.checks lint --output .local/compliance-input/checks/lint.json
      - run: uv run --locked python -m canvas_bridge.compliance.checks format --output .local/compliance-input/checks/format.json
      - run: uv run --locked python -m canvas_bridge.compliance.checks bandit --output .local/compliance-input/checks/bandit.json
      - run: uv run --locked python -m canvas_bridge.compliance.checks licenses --output .local/compliance-input/checks/licenses.json
      - name: Validate lock sources, license metadata and generate Python and Node SBOM
        run: |
          mkdir -p .local/security
          uv export --locked --all-groups --format cyclonedx1.5 --output-file .local/python-sbom.json > /dev/null
          uv run --locked python scripts/supply_chain.py --python-sbom .local/python-sbom.json --stage
      - name: Scan all Git history and current source for secrets
        run: |
          uv run --locked python -m canvas_bridge.compliance.checks secret_history --output .local/compliance-input/checks/secret_history.json
          uv run --locked python -m canvas_bridge.compliance.checks secret_source --output .local/compliance-input/checks/secret_source.json
      - name: Scan build and container configuration
        run: uv run --locked python -m canvas_bridge.compliance.checks container_config --output .local/compliance-input/checks/container_config.json
      - run: uv run --locked pytest --cov=canvas_bridge --cov-report=term-missing -p canvas_bridge.compliance.pytest_plugin --compliance-results=.local/compliance-input/tests.json
      - name: Gate process specifications on current synthetic evidence
        run: uv run --locked python -m canvas_bridge.processes.evaluation --results .local/compliance-input/tests.json --output .local/compliance-input/process-specifications.json
      - run: uv run --locked python -m canvas_bridge.compliance.checks python_vulnerabilities --output .local/compliance-input/checks/python_vulnerabilities.json
      - run: docker build -t canvas-bridge:ci .
      - name: Scan image dependencies and record the actual OS and native library inventory
        run: |
          uv run --locked python -m canvas_bridge.compliance.checks container_image --output .local/compliance-input/checks/container_image.json
          uv run --locked python scripts/security_tools.py trivy image --format cyclonedx --output .local/security/image.cdx.json canvas-bridge:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-inventory
          path: |
            .local/security/*.cdx.json
            .local/security/licenses.json
          if-no-files-found: error
          retention-days: 30
      - run: uv run --locked python -m scripts.verify_linux_container prepare .local/linux-container-fixtures
      - name: Verify isolated extraction in the unprivileged Linux image
        run: uv run --locked python -m canvas_bridge.compliance.checks container_runtime --output .local/compliance-input/checks/container_runtime.json
      - name: Enforce independent release gates before requested public preview builds
        if: >-
          github.ref == 'refs/heads/main' &&
          ((github.event_name == 'push' && contains(github.event.head_commit.message, '[desktop-preview]')) ||
          (github.event_name == 'workflow_dispatch' && inputs.desktop_preview))
        run: >-
          uv run --locked canvas-bridge compliance-report --category offline_core
          --results .local/compliance-input/tests.json --checks .local/compliance-input/checks
          --output .local/preview-release-gate --enforce-release offline_core
      - name: Generate development readiness evidence even when an earlier gate fails
        if: always()
        run: >-
          uv run --locked canvas-bridge compliance-report
          --category synthetic_demo --results .local/compliance-input/tests.json
          --checks .local/compliance-input/checks --output .local/compliance-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: development-readiness
          path: .local/compliance-report/report.*
          if-no-files-found: warn
          retention-days: 30
  desktop:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && contains(github.event.head_commit.message, '[desktop-preview]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.desktop_preview))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.13.4'
      - run: uv sync --locked --group packaging
      - run: uv pip check
      - name: Check platform and packaging dependency licenses
        run: uv run --locked python scripts/supply_chain.py --output .local/security-desktop
      - run: uv run --locked --group packaging python scripts/build_desktop.py
      - run: uv run --locked --group packaging python scripts/smoke_desktop.py --report dist/installers/verification-${{ matrix.name }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ matrix.name }}
          path: dist/installers/*
          if-no-files-found: error
          retention-days: 30
  publish-preview:
    needs: [test, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: desktop-*
          path: release-assets
      - name: Publish local demo downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_desktop.py
